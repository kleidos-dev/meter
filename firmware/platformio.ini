;
; Kleidos bench power meter: an ESP32-S3-N16R8 on a DSX063-1 screw-terminal
; carrier reading a TI INA228 over I2C, to measure what the nine Kleidos boards
; draw.
;
; The instrument's own PlatformIO project, in its own repository since
; 2026-11-19 (it was a nested project of the Kleidos firmware repository
; before).
;
; Build, from the repository root with the PlatformIO virtualenv active:
;
;     source ~/.platformio/penv/bin/activate
;     pio run --project-dir firmware -e meter
;
; That writes to firmware/.pio/. On the Kleidos bench every pio command goes
; through that repository's scripts/pio-job (AGENTS.md, "Firmware"). Upload
; with -t upload and KLEIDOS_METER_PORT naming the CH343 port (README "Flash":
; autodetection would land on a Kleidos board).

[env:meter]
; --- Toolchain pins ---------------------------------------------------------
; Exact, and moved together: an ini override replaces the whole option, so a
; pin that lags keeps building against the old framework in silence. The
; meter left the Kleidos firmware repository on 2026-11-19 with that
; repository's pins (espressif32 7.0.1, ESP-IDF 6.0.3 from a local install);
; on 2026-11-28 it moved to espressif32 8.0.0 and ESP-IDF 6.1.1, whose
; framework package the PlatformIO registry publishes, so the first build
; installs both. The platform's own default (~4.60100.0, ESP-IDF 6.1.0) is
; overridden. tests/firmware/test_project_pins.py keeps them from loosening.
platform = platformio/espressif32 @ 8.0.0
platform_packages = platformio/framework-espidf @ ~4.60101.0
framework = espidf

; The only ESP32-S3 DevKitC JSON this platform ships. Its profile has no
; PSRAM, which sdkconfig.defaults turns on (CONFIG_SPIRAM, octal), and 8 MB of
; flash, which the two lines below correct.
board = esp32-s3-devkitc-1

; The generic DevKitC JSON declares an 8 MB part with no PSRAM. The module on
; this bench is an N16R8: 16 MB of flash and 8 MB of octal PSRAM, both confirmed
; against the package marking. Without these two lines PlatformIO warns about a
; size mismatch and the other 8 MB is unreachable.
board_upload.flash_size = 16MB
board_build.flash_size = 16MB

; The meter's own partition table (FW-16): the calibration record log's
; `calib` partition at 0x9000, the pin map's `pins` at 0xB000 (FW-03) and
; the image (partitions.csv). PlatformIO
; generates partitions.bin from this file; sdkconfig.defaults names the same
; file for ESP-IDF (CONFIG_PARTITION_TABLE_CUSTOM_FILENAME), and
; tests/firmware/test_partition_table.py holds the two together.
board_build.partitions = partitions.csv

; The console is UART0 over the CH343 bridge (carrier-board.md SS 7). The
; stream byte-rate cap in sampler.cpp is derived from this same baud rate
; (docs/architecture.md SS 4.1), so the two must agree -- and
; tests/firmware/test_project_pins.py checks that they do, against
; `kConsoleBaud` as spelled in src/sampler.h.
monitor_speed = 6000000

; --- The port, and the handshake that must not touch it ---------------------
; Neither is PlatformIO's default, and on this bench both defaults are wrong.
;
; 1. The monitor asserts DTR and RTS when it opens the port, and the carrier's
;    two J3Y transistors turn exactly that line state into a reset of the chip
;    (carrier-board.md SS 7, measured). An instrument that reboots when a
;    second terminal attaches loses the capture, so both lines are pinned off.
; 2. The chosen `board = esp32-s3-devkitc-1` declares the NATIVE USB port's
;    hwid (0x303A/0x1001) and the owner uses the CH343 one (1a86:55d3), leaving
;    the native port unplugged — so auto-detection has no matching hwid here
;    and can land on a fleet board. The node name carries the board's own
;    serial number, which is private bench data, so it lives in the
;    environment as KLEIDOS_METER_PORT rather than in this file.
monitor_dtr = 0
monitor_rts = 0
monitor_port = ${sysenv.KLEIDOS_METER_PORT}
upload_port = ${sysenv.KLEIDOS_METER_PORT}
; An upload with no port named would be auto-detected, and every ESP32-S3 of
; the fleet answers to the hwid `board` declares: the guard refuses that, and
; refuses a port that resolves to a board in the inventory. Builds are not
; gated, only `-t upload`.
;
; Before that, scripts/meter_version_reconfigure.py makes an incremental build
; take a changed version.txt: PlatformIO's builder re-runs the CMake configure
; step (where ESP-IDF reads the file into esp_app_desc_t.version) only when a
; CMakeLists.txt or sdkconfig changed, so without it a bumped version.txt
; reached a fresh build tree and not an existing one.
extra_scripts =
    pre:scripts/meter_version_reconfigure.py
    post:scripts/meter_upload_guard.py

; --- The strict compiler gate -----------------------------------------------
; The flag set of [esp32_base] build_src_flags in the Kleidos firmware
; repository's platformio.ini when the meter left it, restated verbatim and held
; by tests/firmware/test_project_pins.py, plus the flags below; the host tests compile with the same
; set (tests/firmware/test_host_build_matches_device.py). Third-party headers
; are reclassified as system includes in CMakeLists.txt, so these only fire on
; our code.
;
; The flags from -Wcast-qual on were added here (2026-11-20, the meter's
; review): they cost nothing and serve the cast, conversion and declaration
; rules docs/misra.md reads. -Wuseless-cast is left out: a cast that one width
; of std::size_t or std::uint32_t needs is useless at the other, and the same
; sources build for the 32-bit device and the 64-bit host.
;
; -Wstack-usage=1024 (0.14.0) bounds every function's frame on the device: the
; largest at -O2 is 944 bytes, a report handler. It is the one flag the host
; build does not share, because its AddressSanitizer redzones grow every frame
; (tests/firmware/test_host_build_matches_device.py, DEVICE_ONLY).
;
; The last eight (FW-01, 2026-11-22) close the hole ESP-IDF leaves in
; -Werror. Its build.cmake gives every component, ours included and before
; these flags, -Wno-error=unused-function, -Wno-error=unused-variable,
; -Wno-error=unused-but-set-variable, -Wno-error=deprecated-declarations,
; -Wno-error=extra, -Wno-unused-parameter, -Wno-sign-compare and
; -Wno-enum-conversion. A later -Werror does not undo a -Wno-error=<w> (the
; per-warning setting wins in either order), and an explicit -Wno-<w> is not
; undone by a later -Wall or -Wextra, so each is answered by name here: the
; -Werror=<w> form for the first five, the -W<w> form for the other three.
; tests/firmware/test_effective_compile_flags.py reads the compile database
; (`pio run -t compiledb`) and fails if any -Wno-error= or -Wno-<w> has the
; last word for a source of ours.
;
; The C++ standard is pinned to C++26 in CMakeLists.txt rather than here, for
; the reason the Kleidos firmware's file records: a `-std` in build_src_flags is
; overridden by the ESP-IDF build system, which appends its own afterwards.
build_src_flags =
    -Wall
    -Wextra
    -Werror
    -Wshadow
    -Wnon-virtual-dtor
    -Wcast-align
    -Wunused
    -Woverloaded-virtual
    -Wformat=2
    -Wold-style-cast
    -Wconversion
    -Wsign-conversion
    -Wdouble-promotion
    -Wcast-qual
    -Wnull-dereference
    -Wswitch-enum
    -Wundef
    -Wredundant-decls
    -Wvla
    -Walloca
    -Wduplicated-cond
    -Wduplicated-branches
    -Wlogical-op
    -Wstack-usage=1024
    -Werror=unused-function
    -Werror=unused-variable
    -Werror=unused-but-set-variable
    -Werror=deprecated-declarations
    -Werror=extra
    -Wunused-parameter
    -Wsign-compare
    -Wenum-conversion

; --- One image --------------------------------------------------------------
; From 0.8.0 the instrument has one image, this one: it drives the shunt
; bypass on a MikroE Relay 2 Click (an IXYS LCA717 PhotoMOS relay, ACTIVE HIGH
; on GPIO15), the rig as wired since 2026-11-20 (docs/relay2-click-wiring.md).
; The HW-316's K2 contact, which this image drove before 0.8.0, does not close
; the ~10 mV dry circuit across the shunt (docs/rig-wiring.md SS 8); the
; `meter_relay2` environment that drove the Click from 0.3.0 to 0.7.0 is
; gone, and an image with an HW-316 bypass is no longer built.
