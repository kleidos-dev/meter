#
# The decision-coverage gate of scripts/test_report.py (docs/testing.md):
# every side of every branch the host tests never take is a test to write or
# a written reason here. The gate fails when more sides are left untaken
# without a reason than `baseline` allows; FW-29 brought it to 0, so every
# side a change leaves untaken is now a test or an entry below in the same
# change (docs/testing.md states the same figure; a guard holds the two equal).
#
# An entry justifies one or both sides of a branch, matched by file and by
# the branch's own source text (so a line moving does not orphan its reason):
#
#   [[exclusion]]
#   file      = "uart0.cpp"
#   decision  = "if ( own.rxReady == nullptr ) {"
#   condition = "own.rxReady == nullptr"   # optional
#   sides     = ["true"]
#   kind      = "defensive"   # or "infeasible", as in mcdc_exclusions.toml
#   reason    = "..."
#
# `condition` names the one operand of an && or || the reason is about (its
# text must be in that operand's own region), so the other operands of the
# same line keep their own gaps; without it the entry covers every region of
# the line. One entry per decision, or per operand of one; an entry's decision
# (and its condition) must be on a current line of firmware/src
# (tests/firmware/test_branch_gate.py). FW-27 counted the sides a test can
# take; FW-28 wrote the console's and its commands', FW-29 the sampler's, the
# driver's and the parser's.

# Untaken sides with no reason, as LLVM 21 counts them on CI's runner: none.
baseline = 0

# None since FW-07: what an invariant made one-sided was removed from the code,
# and the rest is reached. A condition that is the literal `true` (a task's
# `while ( true )`) has no other side and is no branch, to LLVM's own count or
# to the gate (scripts/test_report.py, FOLDED).
