#
# The carrier board, pin by pin: the one description of it (FW-01).
#
# Every terminal of both screw rails of the DSX063-1 carrier, as
# docs/carrier-board.md SS 2 lists them (rail, terminal 1 to 22, silk, GPIO
# or power, ground or reset), and the ESP32-S3's GPIOs the module does not
# break out (the in-package flash and PSRAM lines). Each row has its class:
#
#   free      any role may take it
#   caution   a role may take it, at the cost its hover sentence states
#   reserved  no role may take it: the chip, the board or the firmware holds it
#
# and its reason group, whose sentence and source are below. What each role
# needs of a pin is under [[role]]; the default map, the rig as wired (rev D),
# under [defaults]; the bus's ranges under [bus].
#
# scripts/gen_pin_table.py writes two copies from this file, and never by
# hand: firmware/src/pin_table.h (the firmware's validator, pinmap.h, reads
# it) and host/kleidos_meter/board_pins.json (the panel draws the board from
# it). `python3 scripts/gen_pin_table.py --check` (pre-commit,
# scripts/run_tests.sh) fails when either differs from what this file makes;
# tests/firmware/test_pin_table.py holds docs/carrier-board.md's two rail
# tables to the rows, row for row. A change here regenerates both copies and
# firmware/test/native/golden/pinmap.vectors in the same commit.

[board]
name = "YD-ESP32-S3 (S3-N16R8) on the DSX063-1 carrier"
# GPIO0 to GPIO48: the highest GPIO number of the ESP32-S3, plus one
# (firmware/src/i2c_bus.h kGpioCount). GPIO22 to GPIO25 do not exist.
gpio_count = 49
source = "docs/carrier-board.md §1, §2"

[bus]
# The INA228's strap space (firmware/src/ina228_regs.h kAddressFirst,
# kAddressLast); "auto" scans it at boot, as every image since 0.16.4 does.
address_first = 0x40
address_last = 0x4F
# The own I2C master's clock range (firmware/src/i2c_bus.h kMinClockHz,
# kMaxClockHz).
clock_min_hz = 50000
clock_max_hz = 1000000

# --- What each role needs of a pin ------------------------------------------
#
# In this order: it is the order of PinMap's pins and of the vectors' columns.
# `below` is the first GPIO number the role cannot take.

[[role]]
key = "sda"
label = "INA228 SDA"
below = 49
needs = "Any free or caution pin: the own I2C master routes SDA through the GPIO matrix to any pad below GPIO49."
source = "firmware/src/i2c_bus.h kGpioCount"

[[role]]
key = "scl"
label = "INA228 SCL"
below = 49
needs = "Any free or caution pin: the own I2C master routes SCL through the GPIO matrix to any pad below GPIO49."
source = "firmware/src/i2c_bus.h kGpioCount"

[[role]]
key = "alert"
label = "INA228 ALERT"
below = 32
needs = "A free pin below GPIO32: the ALERT handler reads one interrupt status register, GPIO_STATUS_REG, which latches GPIO0 to GPIO31 only."
source = "firmware/src/sampler.cpp inStatusBank"

[[role]]
key = "relay1"
label = "Relay 1"
below = 49
needs = "Any free or caution pin: the relay bank drives its input as a plain output."
source = "firmware/src/relay.cpp"

[[role]]
key = "relay2"
label = "Relay 2"
below = 49
needs = "Any free or caution pin: the relay bank drives its input as a plain output."
source = "firmware/src/relay.cpp"

# --- The default map: the rig as wired (rev D) --------------------------------

[defaults]
sda = 4
scl = 5
alert = 6
address = "auto"
scl_hz = 400000
pull_sda = "up"
pull_scl = "up"
pull_alert = "up"
relay1 = 7
relay1_active = "low"
relay2 = 15
relay2_active = "high"
source = "hardware/rig.kicad_sch rev D; docs/rig-wiring.md; firmware/src/pinmap.h kDefaultMap"

# --- The reason groups ----------------------------------------------------------

[groups.none]
sentence = "Nothing on the chip or the board claims it."
source = "docs/carrier-board.md §2"

[groups.power]
sentence = "A supply terminal, not a GPIO."
source = "docs/carrier-board.md §6"

[groups.ground]
sentence = "Ground, not a GPIO."
source = "docs/carrier-board.md §6"

[groups.reset]
sentence = "The chip's enable line, not a GPIO: pulling it low reboots the board."
source = "docs/carrier-board.md §2 (vendor: \"RST/EN (pin 3)\")"

[groups.strapping]
sentence = "A strapping pin: its level at reset selects the boot mode, the JTAG source or the VDD_SPI voltage."
source = "ESP-IDF, GPIO & RTC GPIO (ESP32-S3): \"GPIO0, GPIO3, GPIO45 and GPIO46 are strapping pins\""

[groups.memory]
sentence = "A line of the in-package SPI flash or of the octal PSRAM."
source = "ESP-IDF, GPIO & RTC GPIO (ESP32-S3): GPIO26 to GPIO32 flash and PSRAM, GPIO33 to GPIO37 octal PSRAM; the ESP32-S3-DevKitC-1 guide: GPIO35 to GPIO37 \"not available for external use\""

[groups.usb]
sentence = "The native USB pair, used by USB-Serial-JTAG by default."
source = "ESP-IDF, GPIO & RTC GPIO (ESP32-S3): \"GPIO19 and GPIO20 are used by USB-JTAG by default\""

[groups.uart0]
sentence = "UART0, wired to the CH343P bridge: the console, which recovery needs."
source = "docs/carrier-board.md §2, §7"

[groups.led]
sentence = "A status-LED line: the firmware blanks it at boot and holds it low."
source = "firmware/src/status_led.h kLedDataGpios; docs/carrier-board.md §4"

[groups.jtag]
sentence = "A JTAG pad: usable, but taking it costs an external JTAG probe."
source = "ESP32-S3-DevKitC-1 v1.1 guide, J3 rows (MTCK, MTDO, MTDI, MTMS)"

[groups.vdd_spi]
sentence = "In the VDD_SPI power domain: 3.3 V on this S3-N16R8 module, 1.8 V on an R8V part."
source = "ESP-FAQ, development board; docs/carrier-board.md §4, §9 q4"

