#
# The guards' pytest configuration, found by any run that names a path under
# tests/: a warning is an error, as a compiler warning is in the firmware.
# scripts/run_tests.sh, the pre-commit hook and CI also pass -W error.
[pytest]
filterwarnings =
    error
# Parallel by default (host/pyproject.toml says why, and how to run serially:
# -n 0). The guards that build into a directory of their own or share one are
# held by file (--dist loadfile) and, where they must not meet, by the
# `exclusive` marker below.
addopts = -n auto --maxprocesses=8 --dist loadfile
