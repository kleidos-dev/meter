#
# The floors of the page's modules (host/kleidos_meter/panel/static/js), read
# by host/tests/js_coverage.py and held by the last test of
# host/tests/test_panel_browser.py: the smallest percentage of a module's
# functions and blocks, as Chromium's precise coverage counts them, that the
# browser tests may run. A floor only rises (host/tests/test_js_coverage.py
# reads this file's history).
#
# The pure modules (no DOM: chart-math.js, pins-math.js) are held whole: a
# block no test can run lowers the floor and is listed with why. The drawn
# modules are held to their floors, two points under the least of two runs of
# 2026-11-26 since an event-driven page runs a little more or less from one run
# to the next; the gate prints the blocks they leave, and may list one with
# why, by its text as the gate prints it:
#
#   [[uncovered]]
#   module = "chart-math.js"
#   block  = "{ return null; }"
#   reason = "..."

