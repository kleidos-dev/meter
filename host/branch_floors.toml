#
# The host package's branch floors, read by scripts/test_report.py --gate
# (docs/testing.md): the smallest percentage of its branch sides each module's
# tests may take. Every module of kleidos_meter has one, a new module gets its
# own in the commit that adds it, and a floor only rises (tests/ci/
# test_host_floors.py reads this file's history). A module more than three
# sides over its floor is printed as a note: raise it.
#
# Each is what the suite measured, the same on Python 3.13 and 3.14
# (2026-11-25): every side of every module. A side that only a race between
# threads decides is staged by a test (a held read, a barrier, an injected
# clock), so no floor leaves room for a lost race. A side no test could take
# would lower its module's floor and be named here with its reason; there is
# none. A module with no branch is at 100.

[floors]
"kleidos_meter/__init__.py" = 100
"kleidos_meter/calibrate.py" = 100
"kleidos_meter/calibration_cli.py" = 100
"kleidos_meter/capture_cli.py" = 100
"kleidos_meter/cli.py" = 100
