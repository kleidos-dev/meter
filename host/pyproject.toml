[build-system]
requires = ["setuptools>=84.2"]
build-backend = "setuptools.build_meta"

[project]
name = "kleidos-meter"
version = "0.18.0"
description = "Host client for the Kleidos bench power meter's SCPI protocol"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = ["pyserial>=3.5"]

[project.optional-dependencies]
# ruff at the quality kit's hook pin, pypdf at CI's (scripts/check_metadata.py),
# setuptools for the test that builds the wheel and reads what it ships,
# pytest-xdist (exact, like the others that are not the tests' own) for the
# parallel run every pytest invocation starts with (addopts below).
dev = [
    "pytest>=9.2",
    "pytest-cov>=7.1",
    "pytest-xdist==3.8.0",
    "ruff==0.17.6",
    "pypdf==7.2.0",
    "setuptools>=84.2",
]
# The panel's browser tests (tests/test_panel_browser.py): Python Playwright,
# exact, so CI's cached Chromium is the release's, then
# `python -m playwright install chromium`.
browser = ["playwright==1.65.2"]

[project.scripts]
kleidos-meter = "kleidos_meter.cli:main"

[tool.setuptools]
packages = ["kleidos_meter", "kleidos_meter.panel"]

# The panel's page: plain HTML, one stylesheet and ES modules, served as
# they are (kleidos_meter/panel/static.py); and the board's pin table, the
# copy scripts/gen_pin_table.py writes from firmware/board/pins.toml.
[tool.setuptools.package-data]
"kleidos_meter" = ["board_pins.json"]
"kleidos_meter.panel" = ["static/*.html", "static/*.css", "static/js/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A warning is a failure, as a compiler warning is in the firmware.
filterwarnings = ["error"]
# Parallel by default: one worker per core up to eight, a test file to one
# worker (--dist loadfile), so a module's fixtures and the browser module's
# coverage gate, which judges the module's whole run, stay in one process.
# `-n 0` runs serially; a run that talks to the bench (--run-bench) is made
# serial by conftest.py, since the port and the lock are one.
addopts = "-n auto --maxprocesses=8 --dist loadfile"

[tool.coverage.run]
branch = true
source = ["kleidos_meter"]

[tool.coverage.report]
show_missing = true
# The total as measured (statements and branch sides together, Python 3.13
# and 3.14 on 2026-11-25, 3.15 on 2026-11-28): all of them, and the module
# floors say the same (branch_floors.toml).
precision = 2
fail_under = 100

[tool.ruff]
# The repository's configuration (../pyproject.toml), which extends the
# quality kit's rule set: the host package reads the same rules as the rest
# of the tree.
extend = "../pyproject.toml"
# No source roots: kleidos_meter sorts as a third-party import wherever ruff
# runs from, as it does in the guards under tests/ and scripts/ that import it.
src = []
