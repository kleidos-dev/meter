#
# Software composition analysis, as the Kleidos firmware repository runs it
# (its security.yml): OSV-Scanner over the manifests and lockfiles, and Trivy
# over the tree (known vulnerabilities, embedded secrets, licenses) with a
# CycloneDX SBOM. Advisory: every scanner step continues on error, because
# the ESP-IDF and PlatformIO dependency model is not one these scanners read
# in full (the host client's pyproject.toml is), so findings are triaged by
# hand; the blocking secret gate is gitleaks in CI's lint job.
#
# A workflow of its own, beside CI (the project's CI convention): its weekly
# schedule re-scans an unchanged tree for newly disclosed vulnerabilities,
# which would otherwise run the whole of CI on a schedule, and nothing waits
# for it. Both scanners' SARIF go to the repository's Security tab (code
# scanning, free on a public repository), each under a category of its own,
# which needs `security-events: write` on those two jobs alone; the Trivy
# SARIF and the SBOM are also kept as the `security-scan` artifact.
name: Security scan

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  osv-scanner:
    name: "🛡️ Dependency vulnerabilities (OSV, advisory)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run OSV-Scanner
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
        with:
          # --allow-no-lockfiles: the tree has no lockfile OSV-Scanner reads
          # (the ESP-IDF and PlatformIO pins, pyproject.toml without a lock),
          # and without it the scan ends with code 128 and writes no SARIF.
          scan-args: |-
            --format=sarif
            --output-file=osv-results.sarif
            --allow-no-lockfiles
            --recursive
            ./
      - name: Upload the OSV SARIF to code scanning
        if: ${{ !cancelled() && hashFiles('osv-results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: osv-results.sarif
          category: osv-scanner

  trivy:
    name: "🛡️ Dependencies, secrets and licenses (Trivy, advisory, CycloneDX SBOM)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the Trivy filesystem scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,license
          format: sarif
          output: trivy-results.sarif
          exit-code: "0"
      - name: Upload the Trivy SARIF to code scanning
        if: ${{ !cancelled() && hashFiles('trivy-results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: trivy-results.sarif
          category: trivy
      - name: Generate the CycloneDX SBOM
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: sbom.cyclonedx.json
      - name: Keep the SARIF and the SBOM
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-scan
          path: |
            trivy-results.sarif
            sbom.cyclonedx.json
          if-no-files-found: warn
