#
# The Kleidos quality kit's zizmor settings (kleidos-dev/.github
# quality/zizmor/zizmor.yml), copied to .github/zizmor.yml. Every action and
# reusable workflow is pinned by a full commit SHA, GitHub's own included
# (zizmor's default lets actions/* ride a tag), but the kit's own, which a
# repository calls by its name, kleidos-dev/.github/...@v3 (owner, 2026-11-24:
# only the organization's admin can move that branch). This policy would take
# any name there, @main included, so the kit's check holds it to that one
# (quality/run_form.py, "workflows"). There is no ignore list: a
# finding that is reviewed and accepted takes an inline
# `# zizmor: ignore[<rule>]` with the reason on the line above.
rules:
  unpinned-uses:
    config:
      policies:
        "kleidos-dev/.github/*": ref-pin
        "*": hash-pin
  # GitHub's `uses: $/...` self-repository syntax (2026-07-30) is what this
  # audit asks for, but actionlint 1.7.12, the kit's other workflow linter,
  # rejects it as a malformed reusable-workflow call. Off until actionlint
  # accepts it; then the kit switches the ./ calls and drops this.
  self-repository:
    disable: true
