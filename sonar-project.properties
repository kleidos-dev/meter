#
# SonarQube Cloud project configuration for the meter. The CI job that reads
# it is "📊 Sonar" in .github/workflows/check.yml (the quality kit's
# sonar.yml). Scanner reference:
# https://docs.sonarsource.com/sonarqube-cloud/advanced-setup/analysis-parameters/
# Everything this file can carry is set here, so the project can be rebuilt
# from the repository alone; what only SonarQube Cloud holds (Automatic
# Analysis off, the quality gate, the repository binding) is set there for the
# kleidos-dev organization (kleidos-dev/.github, docs/sonarcloud.md).

# --- Project identification ---
# One SonarQube Cloud organization per GitHub owner, its key the owner's login;
# each project's key is <organization>_<repository>, the form the import flow
# generates.
sonar.organization=kleidos-dev
sonar.projectKey=kleidos-dev_meter
sonar.projectName=meter
# The GitHub repository's description, shown on the project's page.
sonar.projectDescription=Kleidos bench power meter: INA228 firmware speaking SCPI, schematic, calibration and host client

# --- Links (settable only here, never in the UI) ---
sonar.links.homepage=https://api.kleidos.dev/meter/
sonar.links.scm=https://github.com/kleidos-dev/meter
sonar.links.issue=https://github.com/kleidos-dev/meter/issues
sonar.links.ci=https://github.com/kleidos-dev/meter/actions

# --- Analysis ---
# CI analysis only: the scanner takes nothing from automatic configuration,
# every setting is in this file, and Automatic Analysis is off in the
# project's settings.
sonar.scanner.autoconfig.enabled=false

# --- Layout ---
# The host package: the client, its simulated instrument, the calibration and
# the panel with its page (host/kleidos_meter/panel/static), and its tests.
# Named explicitly so the firmware, the schematic, the documents, the data and
# the generated files never count as this project's code here. The firmware's
# C++ is not analyzed by SonarQube Cloud yet: its CFamily analyzer needs a
# compile database it can parse (the firmware builds at gnu++26), and the
# firmware's code is held instead by CodeQL (codeql.yml), clang-tidy and
# cppcheck (the static-analysis job) and its MC/DC gate (docs/testing.md).
sonar.sources=host/kleidos_meter
sonar.tests=host/tests
sonar.sourceEncoding=UTF-8

# --- Language ---
# The version CI runs (.python-version).
sonar.python.version=3.13

# --- Coverage ---
# The host package's branch coverage, which CI's coverage job ("🧪 Host
# package coverage (for Sonar)") writes from the repository's root as
# host-coverage.xml, every file named host/kleidos_meter/..., and hands to the
# Sonar job as the "coverage" artifact. The page's modules (panel/static/js) are measured
# by Chromium in the panel job against host/js_floors.toml, a report this
# scanner cannot read, so SonarQube Cloud shows them uncovered.
sonar.python.coverage.reportPaths=host-coverage.xml

# No sonar.issue.ignore.*, no coverage.exclusions and no cpd.exclusions to move
# a number: an issue is fixed with a real change or left open, and coverage is
# raised with tests (the Kleidos rule since 2026-07-12).
